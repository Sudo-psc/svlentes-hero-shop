  faq:
    - id: "tipos-lentes"
      question: "Quais tipos de lentes estão disponíveis?"
      answer: "Oferecemos lentes asféricas (planos mensal, trimestral, semestral e anual), lentes diárias, lentes tóricas para astigmatismo e lentes multifocais para presbiopia. Cada tipo tem planos específicos com diferentes benefícios e preços."
    - id: "entrega"
      question: "Como funciona a entrega?"
      answer: "As lentes são entregues regularmente no seu endereço cadastrado. A frequência varia conforme o plano: mensal para planos mensais, a cada 3 meses para trimestrais, etc. Frete grátis em planos trimestrais e superiores."
    - id: "consultas"
      question: "As consultas estão incluídas?"
      answer: "Sim! Os planos incluem diferentes tipos de consultas: Plano Express não inclui consultas, Plano Smart inclui telemedicina, Plano Premium inclui consultas presenciais, e Plano VIP inclui consultas híbridas (presenciais + online) ilimitadas."
    - id: "diferenca-planos"
      question: "Qual a diferença entre os ciclos de pagamento?"
      answer: "Planos mensais oferecem flexibilidade sem fidelidade. Planos trimestrais, semestrais e anuais oferecem economia progressiva: 13% no trimestral, 19% no semestral e 29% no anual, além de mais benefícios como consultas inclusas e entrega gratuita."
    - id: "lentes-especiais"
      question: "Como funcionam as lentes tóricas e multifocais?"
      answer: "Lentes tóricas corrigem astigmatismo e multifocais corrigem presbiopia (vista cansada). Ambas exigem consulta obrigatória com Dr. Philipe para avaliação e adaptação. Os preços são: Tóricas a partir de R$ 159/mês e Multifocais a partir de R$ 189/mês."
    - id: "cancelamento"
      question: "Posso cancelar a assinatura?"
      answer: "Sim, você pode pausar ou cancelar sua assinatura a qualquer momento, sem multas ou taxas de cancelamento. Basta entrar em contato através do portal do cliente ou via WhatsApp."
    - id: "pagamento"
      question: "Como funciona o pagamento?"
      answer: "Você pode parcelar em até 12 vezes nos planos trimestrais, semestrais e anuais, ou pagar mensalmente nos planos mensais. Aceitamos cartão de crédito, PIX com desconto e boleto bancário através da plataforma Asaas."
    - id: "receita"
      question: "Preciso de receita médica?"
      answer: "Sim, para sua segurança e saúde ocular, é necessário ter uma receita médica válida. Se você ainda não tem, podemos agendar uma consulta de avaliação e adaptação de lentes de contato com Dr. Philipe."
    - id: "qualidade"
      question: "As lentes são de qualidade?"
      answer: "Sim! Trabalhamos apenas com lentes de contato de marcas reconhecidas e certificadas pela ANVISA. Todas as lentes são embaladas individualmente e em ambiente estéril, garantindo máxima segurança e qualidade."
    - id: "economia"
      question: "Como funciona a economia nos planos?"
      answer: "A economia é progressiva: plano trimestral oferece 13% de desconto, semestral 19% e anual 29% em comparação com o plano mensal. Além disso, você economiza em consultas médicas e frete, que são incluídos nos planos mais completos."

  economyCalculator:
    averagePrices:
      daily:
        avulso: 4.50
        subscription: 2.70
      weekly:
        avulso: 12.00
        subscription: 7.20
      monthly:
        avulso: 25.00
        subscription: 15.00
    usagePatterns:
      occasional:
        daysPerMonth: 10
        multiplier: 0.33
      regular:
        daysPerMonth: 20
        multiplier: 0.67
      daily:
        daysPerMonth: 30
        multiplier: 1.0

