# Nginx production configuration for SV Lentes Next.js application
# This file assumes a systemd-managed Next.js process listening on 127.0.0.1:5000
# TLS certificates managed via Let's Encrypt and stored under /etc/letsencrypt/live/svlentes.com.br/

user www-data;
worker_processes auto;
pid /run/nginx.pid;

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    server_tokens off;
    aio threads;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$request_time" "$upstream_response_time" '
                    '$scheme://$host$request_uri';

    access_log /var/log/nginx/svlentes.access.log main;
    error_log  /var/log/nginx/svlentes.error.log warn;

    map $request_uri $static_cache_control {
        default "public, max-age=60, s-maxage=600";
        ~*^/(sw|service-worker) "public, max-age=0, must-revalidate";
        ~*^/_next/static/ "public, max-age=31536000, immutable";
        ~*\.(?:css|js)$ "public, max-age=31536000, immutable";
        ~*\.(?:jpg|jpeg|gif|png|webp|svg|ico)$ "public, max-age=31536000, immutable";
        ~*\.(?:woff|woff2|ttf|otf)$ "public, max-age=31536000, immutable";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:50m inactive=7d use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/rss+xml text/xml image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;

    brotli on;
    brotli_comp_level 5;
    brotli_static on;
    brotli_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    upstream nextjs_app {
        server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name svlentes.com.br www.svlentes.com.br svlentes.shop www.svlentes.shop;

        include snippets/letsencrypt.conf;

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }

        location / {
            return 301 https://svlentes.com.br$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name svlentes.com.br;

        ssl_certificate     /etc/letsencrypt/live/svlentes.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/svlentes.com.br/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/svlentes.com.br/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self 'https://js.stripe.com' 'https://checkout.stripe.com')" always;
        # Enhanced CSP for Stripe Pricing Table integration
        # Note: $csp_nonce should be set by backend (Next.js middleware) via X-CSP-Nonce header
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://accounts.google.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob: https://*.stripe.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.sendpulse.com https://api.stripe.com https://svlentes.shop https://svlentes.com.br https://www.google-analytics.com https://firebasestorage.googleapis.com https://firebase.googleapis.com https://securetoken.googleapis.com https://accounts.google.com https://www.googleapis.com; frame-src 'self' https://js.stripe.com https://checkout.stripe.com https://accounts.google.com;" always;

        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;

        limit_req zone=perip burst=40 nodelay;
        limit_conn perip_conn 40;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Request-Start "t=$msec";
        proxy_intercept_errors on;

        location = /robots.txt {
            add_header Cache-Control "public, max-age=86400" always;
            proxy_pass http://nextjs_app;
        }

        location = /sitemap.xml {
            add_header Cache-Control "public, max-age=43200" always;
            proxy_pass http://nextjs_app;
        }

        location /_next/static/ {
            proxy_cache STATIC;
            proxy_cache_valid 200 301 302 31536000;
            proxy_hide_header Set-Cookie;
            expires 1y;
            add_header Cache-Control $static_cache_control always;
            proxy_pass http://nextjs_app;
        }

        location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?)$ {
            proxy_cache STATIC;
            proxy_cache_valid 200 301 302 31536000;
            proxy_hide_header Set-Cookie;
            expires 1y;
            add_header Cache-Control $static_cache_control always;
            proxy_pass http://nextjs_app;
        }

        location /api/health-check {
            proxy_pass http://nextjs_app;
            proxy_read_timeout 10s;
        }

        location /api/ {
            proxy_pass http://nextjs_app;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /_next/data/ {
            proxy_cache STATIC;
            proxy_cache_valid 200 5m;
            add_header Cache-Control "public, max-age=300, stale-while-revalidate=600" always;
            proxy_pass http://nextjs_app;
        }

        location / {
            proxy_pass http://nextjs_app;
            proxy_redirect off;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffers 32 4k;
            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 64k;
            try_files $uri @next_fallback;
        }

        location @next_fallback {
            proxy_pass http://nextjs_app;
        }

        error_page 500 502 503 504 /_error;
        location = /_error {
            internal;
            proxy_pass http://nextjs_app;
        }

        include /etc/nginx/conf.d/custom/*.conf;
    }
}
